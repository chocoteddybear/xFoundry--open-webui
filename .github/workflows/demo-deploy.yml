# Builds the slim image on GitHub's machines and runs it on the demo Droplet.
# Needs repository secrets: DROPLET_HOST, DROPLET_USER, DROPLET_SSH_KEY.
name: Demo deploy

on:
  push:
    branches: [demo/deploy]
  workflow_dispatch:

concurrency:
  group: demo-deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/chocoteddybear/owui-demo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            USE_SLIM=true
            NODE_OPTIONS=--max-old-space-size=6144
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=demo
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Copy compose files
        env:
          TARGET: ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}
        run: |
          scp deploy/docker-compose.yml deploy/Caddyfile scripts/live-session/fake_openai_server.py \
            "$TARGET:/opt/owui-demo/"
      - name: Pull and restart
        env:
          TARGET: ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # The token goes through stdin so it never appears in a command line on the server.
          printf '%s' "$TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh "$TARGET" "cd /opt/owui-demo \
            && docker compose pull \
            && docker compose up -d --remove-orphans \
            && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile \
            && docker image prune -f \
            && docker logout ghcr.io"
